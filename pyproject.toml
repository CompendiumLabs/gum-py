[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gum-py"
version = "2.1.0"
description = "Python bindings for Gum vector graphics."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Douglas Hanley"}
]
dependencies = [
    "Pillow"
]

[project.optional-dependencies]
plotting = ["numpy", "pandas"]

[project.urls]
Homepage = "https://github.com/CompendiumLabs/gum.py"

[tool.setuptools]
packages = ["gum"]
include-package-data = false

[tool.setuptools.package-data]
gum = [
    "js/*.ts",
    "js/*.json",
    "js/bun.lock",
]
